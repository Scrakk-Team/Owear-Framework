name: Release (npm)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # ── Kernel nativo (el runtime de Linux se empaqueta desde aquí) ──────────
      - name: Deps del kernel (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libssl-dev zlib1g-dev ninja-build
      - name: Build del kernel
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
      - name: Empaquetar runtime @owear/linux-x64-gnu
        run: node tools/pack-runtime.mjs --target linux-x64-gnu

      - name: Aviso — runtimes de Windows/macOS
        run: |
          echo "::notice::@owear/win32-x64 y @owear/darwin-* se publican desde runners nativos (ver docs/ROADMAP.md). En este job solo se publica el de Linux."

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # sanity: los generados de APIs están al día y los manifiestos sincronizados
      - run: node tools/gen-apis.mjs --check
      - run: node tools/check-apis.mjs

      - name: Publish (scoped → público)
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
