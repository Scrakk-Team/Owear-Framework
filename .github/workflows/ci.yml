name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Quality · licencia, versión y APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cabeceras SPDX (Apache-2.0)
        run: node tools/license-header.mjs --check
      - name: Versión única + changelog
        run: node tools/version.mjs check
      # El descubrimiento (CMake) y el registro de builtins se GENERAN desde
      # api/<nombre>/owear.module.json. Si alguien toca un manifiesto y no
      # regenera, aquí se cae.
      - name: Los generados están al día
        run: node tools/gen-apis.mjs --check
      - name: Manifiestos sincronizados con el código C++
        run: node tools/check-apis.mjs
      - name: Lista de APIs
        run: node packages/cli/src/ow.js api list

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint de mensajes de commit
        run: node tools/check-commits.mjs "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  linux:
    name: Linux · build + tests + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libssl-dev zlib1g-dev ninja-build xvfb \
            libayatana-appindicator3-dev
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release
      - run: ctest --test-dir build/linux-release --output-on-failure
      - name: E2E headless (suites all/builtins bajo Xvfb)
        run: |
          sudo apt-get install -y dbus-x11 dunst upower || true
          export $(dbus-launch)   # session bus para notification/power
          # dunst crashea puntual en runners (Trace/breakpoint trap):
          # reintentos con espera activa; si tras 3 intentos no vive, el
          # E2E sigue (notification/power reportarán fallo visible).
          for i in 1 2 3; do
            (dunst >/dev/null 2>&1 &)
            sleep 1
            pgrep -x dunst >/dev/null && break
          done
          MODS=""
          for d in build/linux-release/src/api/*/; do
            if [ "$d" != "build/linux-release/api/CMakeFiles/" ]; then
              MODS="$MODS$d:"
            fi
          done
          MODS=${MODS%:}
          (cd tests/e2e/www && python3 -m http.server 8123 >/dev/null 2>&1 &)
          sleep 0.5
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env OW_APP_NAME=CI GDK_BACKEND=x11 OW_MODULES_DIR="$MODS" \
            setsid ./build/linux-release/src/owear > /tmp/owear-e2e.log 2>&1 &
          sleep 5
          timeout 150 python3 tests/e2e/run_suites.py \
            --pages all.html builtins.html veto.html --port 8123 --sdk || \
          { echo "::group::log del kernel"; cat /tmp/owear-e2e.log; echo "::endgroup::"; exit 1; }

      - name: Auto-update nativo (apply + rollback + commit sobre copia)
        run: |
          sudo apt-get install -y xvfb || true
          timeout 180 python3 tests/e2e/update_apply.py

  windows:
    name: Windows · compile + smoke (MSVC + vcpkg zlib/openssl)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Deps (zlib + openssl vía vcpkg preinstalado)
        run: vcpkg install zlib openssl --triplet x64-windows
        shell: cmd
      - name: Configure
        shell: cmd
        run: cmake --preset windows-release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build --preset windows-release
      - name: Smoke test E2E (kernel + módulos + ventana WebView2 real)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = "build\windows-release\src\Release\owear.exe"
          if (!(Test-Path $exe)) { $exe = "build\windows-release\src\Debug\owear.exe" }
          Write-Host "exe=$exe"
          if (!(Test-Path "build\windows-release\src\Release\owear.exe") -and !(Test-Path "build\windows-release\src\Debug\owear.exe")) {
            Write-Error "owear.exe no existe"; exit 1
          }
          $mods = (Get-ChildItem "build\windows-release\src\api" -Directory | ForEach-Object {
              if (Test-Path "$($_.FullName)\Release") { "$($_.FullName)\Release" }
            }) -join ";"
          Write-Host "OW_MODULES_DIR=$mods"
          $env:OW_APP_NAME = "CI"
          $env:OW_MODULES_DIR = $mods
          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
                    -RedirectStandardError "owear-smoke.err.log" `
                    -RedirectStandardOutput "owear-smoke.out.log"
          try {
            python tests/smoke_windows.py $proc.Id
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # La suite E2E cross-platform (all.html/builtins.html) es Linux-first:
            # hoy all.html no termina y builtins.html provoca un access violation
            # nativo en Windows. El soporte de Windows está en estado VERIFY
            # (docs/roadmap.md), así que este job se limita a compile + smoke real
            # (WebView2 + control socket). Rehabilitar la suite completa cuando
            # Windows pase a verde en un desktop real.
            # salida limpia: app.quit por la pipe y WaitForExit
            python tests/quit_windows.py $proc.Id
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $proc.WaitForExit(20000) | Out-Null
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              Write-Error "el kernel no salió tras app.quit"
              exit 1
            }
            Write-Host "smoke E2E OK: ventana WebView2 creada y salida limpia (exit $($proc.ExitCode))"
          } finally {
            Write-Host "::group::stderr del kernel"; Get-Content "owear-smoke.err.log" -ErrorAction SilentlyContinue; Write-Host "::endgroup::"
            Write-Host "::group::stdout del kernel"; Get-Content "owear-smoke.out.log" -ErrorAction SilentlyContinue; Write-Host "::endgroup::"
          }

  packages:
    name: Paquetes npm (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter './packages/**' -r build
      - run: pnpm --filter './packages/**' -r typecheck
