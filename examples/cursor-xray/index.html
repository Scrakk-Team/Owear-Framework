<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor X-Ray — Owear</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e13;
      --panel: #10161d;
      --panel2: #0d1319;
      --line: #1c2630;
      --txt: #e6edf3;
      --muted: #7d8b99;
      --accent: #4ade80;
      --cursor: #8affc1;
      --pin: #ffb454;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .titlebar {
      height: 38px; display: flex; align-items: center; gap: 8px; padding-left: 12px;
      background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
    }
    .title { font-weight: 600; }
    .spacer { flex: 1; height: 100%; }
    .controls { display: flex; height: 100%; }
    .controls button {
      width: 44px; height: 100%; border: 0; background: transparent; color: var(--muted);
      font-size: 14px; cursor: pointer;
    }
    .controls button:hover { background: #1a222c; color: var(--txt); }
    .controls #btn-close:hover { background: #e5484d; color: #fff; }

    .layout {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 320px;
    }
    .stage { position: relative; min-height: 0; padding: 14px; }
    canvas { width: 100%; height: 100%; display: block; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); }

    .side {
      border-left: 1px solid var(--line); background: var(--panel);
      padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px;
    }
    .readout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .stat .v { font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .stat.wide { grid-column: 1 / -1; }
    .stat.wide .v { font-size: 14px; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button.action {
      flex: 1 1 auto; min-width: 120px; padding: 9px 12px; border-radius: 9px;
      border: 1px solid var(--line); background: #16202a; color: var(--txt);
      font: inherit; cursor: pointer;
    }
    button.action:hover { border-color: #2b3946; background: #1a2632; }
    button.action.on { background: #14361f; border-color: #2f6b41; color: var(--accent); }
    .hint { color: var(--muted); font-size: 12px; }
    pre {
      margin: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px; font-size: 12px; overflow: auto; color: #cfe3d6;
    }
    h3 { margin: 6px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    kbd {
      background: #1a222c; border: 1px solid var(--line); border-bottom-width: 2px;
      border-radius: 5px; padding: 1px 6px; font: inherit; font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="title" data-ow-drag>🖱️ Cursor X-Ray — Owear</div>
    <div class="spacer" data-ow-drag></div>
    <nav class="controls">
      <button id="btn-min" title="Minimizar">–</button>
      <button id="btn-max" title="Maximizar">□</button>
      <button id="btn-close" title="Cerrar">✕</button>
    </nav>
  </header>

  <div class="layout">
    <main class="stage">
      <canvas id="view"></canvas>
    </main>

    <aside class="side">
      <div class="readout">
        <div class="stat"><div class="k">Cursor X</div><div class="v" id="cx">—</div></div>
        <div class="stat"><div class="k">Cursor Y</div><div class="v" id="cy">—</div></div>
        <div class="stat wide"><div class="k">Monitor</div><div class="v" id="mon">—</div></div>
        <div class="stat wide"><div class="k">Punto fijado</div><div class="v" id="pin">—</div></div>
      </div>

      <div class="row">
        <button class="action" id="btn-follow">▶ Seguir cursor</button>
        <button class="action" id="btn-pin">📍 Fijar punto</button>
      </div>
      <div class="row">
        <button class="action" id="btn-copy">📋 Copiar coords</button>
        <button class="action" id="btn-notify">🔔 Notificar</button>
      </div>
      <div class="hint">
        La posición global del cursor la da el módulo nativo <code>screen</code>.
        El DOM sólo ve el cursor dentro de la ventana; esto es la del SO.
      </div>

      <h3>Módulo propio: hostinfo</h3>
      <button class="action" id="btn-sysinfo">🖥️ Leer info del sistema (C++)</button>
      <pre id="sysinfo">Pulsa para invocar hostinfo.info() — un .owm propio.</pre>
    </aside>
  </div>

  <script type="module" src="/src/renderer.ts"></script>
</body>
</html>
