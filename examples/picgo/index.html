<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicGo · Owear</title>
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar__drag" data-ow-drag>
        <span class="mark"></span>
        <span class="name">PicGo <span class="ow">· Owear</span></span>
      </div>
      <div class="titlebar__controls">
        <button id="win-min" class="winbtn" title="Minimizar">—</button>
        <button id="win-close" class="winbtn winbtn--close" title="Cerrar">✕</button>
      </div>
    </header>

    <main class="page">
      <section id="drop" class="drop">
        <p class="drop__hint">Arrastra imágenes aquí o</p>
        <button id="pick" class="btn btn--primary">Elegir imágenes…</button>
        <p class="drop__sub">Se suben con el core de <strong>PicGo</strong> (config: <code id="cfg">~/.picgo/config.json</code>).</p>
      </section>

      <section class="panel">
        <header class="panel__head">
          <h2>Cola</h2>
          <span class="count" id="count">0</span>
        </header>
        <ul id="queue" class="list"></ul>
        <div class="actions">
          <button id="clear" class="btn btn--ghost">Limpiar</button>
          <button id="upload" class="btn btn--primary" disabled>Subir</button>
        </div>
      </section>

      <section class="panel">
        <header class="panel__head"><h2>Resultados</h2></header>
        <ul id="results" class="list list--results"></ul>
      </section>
    </main>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
