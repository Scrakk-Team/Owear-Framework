<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owear Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #10161d;
      --line: #1c2630;
      --txt: #e6edf3;
      --muted: #7d8b99;
      --accent: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Titlebar custom: el kernel convierte [data-ow-drag] en zona de arrastre.
       Los botones viven FUERA de esa zona para no iniciar drag al pulsarlos. */
    .titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .title { font-weight: 600; letter-spacing: .2px; }
    .spacer { flex: 1; height: 100%; }
    .controls { display: flex; height: 100%; }
    .controls button {
      width: 44px;
      height: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }
    .controls button:hover { background: #1a222c; color: var(--txt); }
    .controls #btn-close:hover { background: #e5484d; color: #fff; }

    .hud {
      display: flex;
      gap: 22px;
      align-items: center;
      padding: 10px 16px;
      flex: 0 0 auto;
      color: var(--muted);
    }
    .hud b { color: var(--txt); font-variant-numeric: tabular-nums; }
    .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }

    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 18px;
    }
    .board-wrap { position: relative; }
    canvas {
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 0 0 1px rgba(74, 222, 128, .06);
    }
    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(6, 9, 12, .72);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 24px;
      transition: opacity .12s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { margin: 0; font-size: 22px; }
    .overlay p { margin: 0; color: var(--muted); max-width: 36ch; }
    .overlay b { color: var(--accent); }
    .muted { color: #55636f; font-size: 12px; }
    kbd {
      background: #1a222c;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
      font: inherit;
      font-size: 12px;
      color: var(--txt);
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="title" data-ow-drag>🐍 Owear Snake</div>
    <div class="spacer" data-ow-drag></div>
    <nav class="controls">
      <button id="btn-min" title="Minimizar">–</button>
      <button id="btn-max" title="Maximizar">□</button>
      <button id="btn-close" title="Cerrar">✕</button>
    </nav>
  </header>

  <div class="hud">
    <span class="k">Puntos <b id="score">0</b></span>
    <span class="k">Récord <b id="best">0</b></span>
    <span class="k">Velocidad <b id="speed">0/s</b></span>
    <span class="k" style="margin-left:auto">Flechas / WASD · <kbd>P</kbd> pausa</span>
  </div>

  <main class="stage">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Cargando…</h2>
        <p id="overlay-text"></p>
      </div>
    </div>
  </main>

  <script type="module" src="/src/renderer.ts"></script>
</body>
</html>
